apisix:
  node_listen:
    - port: 9080

deployment:
  role: traditional

  role_traditional:
    config_provider: etcd

  admin:
    admin_listen:
      ip: 0.0.0.0
      port: 9180

    allow_admin:
      - 127.0.0.0/24
      - 172.19.0.0/16

    admin_key:
      - name: admin
        key: partilon-admin-key-2026
        role: admin

  etcd:
    host:
      - "http://etcd:2379"
    prefix: /apisix
    timeout: 30

nginx_config:
  http:
    # Adds the correlation ID (generated by the request-id plugin, or kept from
    # the caller) to every gateway access-log line so the gateway hop can be
    # matched with the service and agent logs.
    access_log_format: '$remote_addr - $remote_user [$time_local] $http_host "$request" $status $body_bytes_sent $request_time "$http_user_agent" $upstream_addr $upstream_status correlation_id=$http_x_correlation_id'
